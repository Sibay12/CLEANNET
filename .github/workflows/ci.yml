name: CLEANNET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app

  esp32c3-firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C3 firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/esp32c3
          idf.py set-target esp32c3
          idf.py build
      - name: Publish OTA image into repository for Render hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware/releases
          cp firmware/esp32c3/build/cleannet_esp32c3_dns.bin firmware/releases/cleannet_esp32c3_dns.bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/releases/cleannet_esp32c3_dns.bin
          if ! git diff --cached --quiet; then
            git commit -m "Publish CLEANNET ESP32-C3 OTA firmware image"
            git push
          fi
      - name: Upload OTA firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: cleannet-esp32c3-firmware-0.2.2
          path: firmware/esp32c3/build/cleannet_esp32c3_dns.bin
          if-no-files-found: error
          retention-days: 30
