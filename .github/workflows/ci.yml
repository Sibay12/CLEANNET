name: CLEANNET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app

  esp32c3-firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C3 firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/esp32c3
          idf.py set-target esp32c3
          idf.py build
      - name: Publish OTA image into repository for Render hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          path = "firmware/releases/cleannet_esp32c3_dns.bin"
          with open("firmware/esp32c3/build/cleannet_esp32c3_dns.bin", "rb") as f:
              encoded = base64.b64encode(f.read()).decode("ascii")
          api = "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"] + "/contents/" + path
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          payload = {
              "message": "Publish CLEANNET ESP32-C3 OTA firmware [skip ci]",
              "content": encoded,
              "branch": os.environ["GH_BRANCH"],
          }
          try:
              req = urllib.request.Request(api, headers=headers)
              with urllib.request.urlopen(req) as response:
                  existing = json.loads(response.read().decode("utf-8"))
              payload["sha"] = existing["sha"]
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          req = urllib.request.Request(api, data=json.dumps(payload).encode(), headers=headers, method="PUT")
          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read().decode("utf-8"))
          print("Published:", result["content"]["path"])
          print("Commit:", result["commit"]["sha"])
          PY
      - name: Upload OTA firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: cleannet-esp32c3-firmware-0.2.2
          path: firmware/esp32c3/build/cleannet_esp32c3_dns.bin
          if-no-files-found: error
          retention-days: 30
