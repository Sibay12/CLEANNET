services:
  - type: web
    name: cleannet-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FIRMWARE_ENABLED
        value: "false"
      - key: FIRMWARE_VERSION
        value: "0.1.0"
      - key: FIRMWARE_CHANNEL
        value: stable
      - key: FIRMWARE_URL
        sync: false
      - key: FIRMWARE_SHA256
        sync: false
      - key: FIRMWARE_MIN_BATTERY
        value: "0"
